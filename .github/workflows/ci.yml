name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/sync_version.py --check
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm package builds
        working-directory: npm
        run: npm run prepack && npm run check && npm pack --dry-run
