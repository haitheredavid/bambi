name: release
# Two ways in:
#  - Actions tab -> release -> Run workflow (pick patch/minor/major): bumps with `uv version`,
#    commits, tags and publishes.
#  - `just release` locally, then `git push --follow-tags`: publishes the pushed tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

concurrency: release

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: astral-sh/setup-uv@v6
      - run: uv version --bump ${{ inputs.bump }}
      - id: tag
        run: echo "tag=v$(uv run python scripts/sync_version.py)" >> "$GITHUB_OUTPUT"
      - run: uv run pytest -q
      - name: commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock .claude-plugin/plugin.json npm/package.json
          git commit -m "chore: release ${{ steps.tag.outputs.tag }}"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "${{ steps.tag.outputs.tag }}"
          git push --follow-tags

  publish:
    needs: bump
    # bump is skipped on a tag push; run either way unless it failed
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    env:
      TAG: ${{ needs.bump.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}", lfs: true }
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: versions match the tag
        run: |
          test "v$(uv version --short)" = "$TAG"
          uv run python scripts/sync_version.py --check
      - run: uv build
      - name: wheel ships skills, docs and data
        run: |
          whl=$(ls dist/*.whl)
          uvx --from "$whl" bambi docs p1s-rules > /dev/null
          tmp=$(mktemp -d) && uvx --from "$whl" bambi skills install --target codex --project "$tmp"
          test -f "$tmp/.agents/skills/print/SKILL.md"
      - name: GitHub release
        # re-runnable: upload (overwrite) assets if the release already exists
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
        env: { GH_TOKEN: "${{ github.token }}" }
      # Trusted publishing (OIDC, id-token: write above): no NPM_TOKEN. Needs npm >= 11.5.1
      # and the package's trusted publisher set to this repo + release.yml on npmjs.com.
      - run: npm install -g npm@latest
      - name: publish npm
        working-directory: npm
        # skip when this version is already on npm (re-runs)
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${TAG#v}" version > /dev/null 2>&1; then
            echo "already published"
          else
            npm publish --provenance
          fi
